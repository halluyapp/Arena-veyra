name: Native Android phone and TV

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/native
    env:
      EXPO_PUBLIC_VEYRA_API_BASE_URL: ${{ vars.VEYRA_API_BASE_URL }}
      EXPO_NO_TELEMETRY: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/native/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            apps/native/package-lock.json
            android/**/*.gradle
      - uses: android-actions/setup-android@v4.0.4
      - name: Install native dependencies
        run: npm ci
      - name: Check native types
        run: npm run typecheck
      - name: Test native domain and download lifecycle
        run: npm test
      - name: Bundle native application
        run: npm run export
      - name: Generate Android phone and TV project
        run: npm run prebuild
      - name: Build installable standalone APK
        run: ./gradlew --no-daemon assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --stacktrace
        working-directory: apps/native/android
      - name: Verify APK
        run: test -s android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v7
        with:
          name: veyra-native-phone-tv-preview
          path: apps/native/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
